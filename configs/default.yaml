seed: 13
data:
  musique_dir: data/musique            # official MuSiQue-Ans jsonl files
  n_test: 300                          # preliminary study: e.g. 300
  n_val: 100
  n_external: 20000                    # paragraphs from other questions (distractors, filler)
conditions: [clean, removed, counterfactual]   # preliminary; add distractor for the full study
generator:
  model_id: PeterJinGo/SearchR1-nq_hotpotqa_train-qwen2.5-7b-em-ppo   # as in Search-R1 infer.py
  top_k: 3              # Search-R1 retriever.topk
  max_turns: 5          # = 4 searches + 1 final answer turn (Search-R1 max_turns=4)
  max_new_tokens: 512   # Search-R1 max_response_length=500
vllm:                   # Kaggle 2x T4: fp16 (T4 has no bfloat16), tensor parallel over 2 GPUs
  tensor_parallel_size: 2
  dtype: half
  max_model_len: 8192
retriever: intfloat/e5-base-v2
label_judge: meta-llama/Llama-3.1-8B-Instruct     # never also used as a verifier
verifiers:
  nli: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
  alignscore_ckpt: ckpts/AlignScore-large.ckpt
  minicheck: roberta-large
  llm_judge: mistralai/Mistral-7B-Instruct-v0.3
  llm_judge_subsample: 0.2
scopes: [loc, acc, traj, pool, pad]
analysis:
  n_boot: 10000
  delta: TODO      # cascade tolerance, fix after the pilot and before test evaluation
